<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-columns-rows</title>
    <style>
        nav{
        width: 100%;
        height: 50px;
        background-color: gray;
        margin: 20px 0px;
        a{
            background-color: whitesmoke;
            padding: 10px;
            margin: 10px;
        }
    }
    .grid-container{
        width: 100%;
        height: 700px;
        background-color: crimson;
        /*Modulo grid*/
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr .5fr 2fr 1fr;
        gap: 10px;
    }
    .grid-item{
        background-color: brown;
    }
    .item1{
        background-color: violet;
        grid-column-start: 1;
        grid-column-end: 4;
    }
    .item2{
        background-color: aqua;
        grid-column-start: 1;
        grid-column-end: 4;
    }
    .item3{
        background-color: darkorange;
        grid-column-start: 1;
        grid-column-end: 3;
    }
    .item4{
        background-color: cornflowerblue;
        grid-column-start: 3;
        grid-column-end: 4;
    }
    .item5{
        background-color: steelblue;
        grid-column-start: 1;
        grid-column-end: 4;
    }
    @media screen and (max-width: 720px) {
        .grid-container{
            height: auto;
        /*Modulo grid*/
        grid-template-columns: 1fr;
        grid-template-rows: 150px 50px 500px 300px 200px;
        gap: 10px;
    }
    .grid-item{
        background-color: brown;
    }
    .item1{
        background-color: violet;
        grid-column-start: 1;
        grid-column-end: 2;
    }
    .item2{
        background-color: aqua;
        grid-column-start: 1;
        grid-column-end: 2;
    }
    .item3{
        background-color: darkorange;
        grid-column-start: 1;
        grid-column-end: 2;
    }
    .item4{
        background-color: cornflowerblue;
        grid-column-start: 1;
        grid-column-end: 2;
    }
    .item5{
        background-color: steelblue;
        grid-column-start: 1;
        grid-column-end: 2;
    }
    }
    </style>
</head>
<nav>
    <a href="./index.html">Grid-area</a>
</nav>
<body>
    <section class="grid-container">
        <div class="grid-item item1">1</div>
        <div class="grid-item item2">2</div>
        <div class="grid-item item3">3</div>
        <div class="grid-item item4">4</div>
        <div class="grid-item item5">5</div>
    </section>
</body>
</html>
